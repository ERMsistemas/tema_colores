name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          ACA798: ${{ secrets.ACA798 }}
          B1AB25: ${{ secrets.B1AB25 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('ACA798', '')
          bm = os.environ.get('B1AB25', '')
          count = 0
          for p in pathlib.Path('.').rglob('*.html'):
              try:
                  s = p.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              s2 = s
              if gm:
                  s2 = s2.replace('<!-- 19c30dbdee5acaa4873d3731efa96acdfa6d14 -->', gm)
              if bm:
                  s2 = s2.replace('<!-- f001a1268fa3ab105db6678d47f6fdc84f4c8a46bc98 -->', bm)
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
                  count += 1
          if count == 0 and (gm or bm):
              sys.exit(1)
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
